<style>
  :root{
    --bg-deep:#1c1428;
    --bg-mid:#2a1c38;
    --gold:#d9a2a0;
    --gold-soft:#eec3bf;
    --cream:#f6ece6;
    --muted:#b39cbf;
    --line:rgba(217,162,160,0.25);
    --cat:#8b7bc9;
    --dog:#e28a5f;
    --swan:#8fc3e8;
    --fox:#f0a94e;
    --rabbit:#f0a8c6;
    --owl:#7fae94;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(217,162,160,0.14), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(111,163,201,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
    color:var(--cream);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
  }
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0;}
  .stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:var(--gold-soft); opacity:.55;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.9; transform:scale(1.5);}
  }
  @media (prefers-reduced-motion: reduce){ .stars span{animation:none;} }

  .app{position:relative; z-index:1; width:100%; max-width:460px; margin:auto 0;}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    backdrop-filter:blur(6px);
    min-height:420px;
    display:flex;
    flex-direction:column;
  }

  .eyebrow{font-size:12px; letter-spacing:0.32em; color:var(--gold); text-align:center; text-transform:uppercase;}
  h1.title{
    font-family:'Shippori Mincho', serif; font-weight:800; font-size:29px;
    line-height:1.5; text-align:center; margin:14px 0 8px; color:var(--cream);
  }
  h1.title em{font-style:normal; color:var(--gold);}
  .pain-lines{margin-bottom:14px;}
  .pain-lines p{
    font-family:'Shippori Mincho', serif; font-weight:600;
    font-size:16px; line-height:1.9; text-align:center; color:var(--cream);
    word-break:keep-all; overflow-wrap:break-word;
  }
  .lede{
    text-align:center; font-size:13.5px; line-height:2; color:var(--muted);
    margin:0 auto 26px; max-width:340px;
    word-break:keep-all; overflow-wrap:break-word;
  }
  .constellation-divider{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:6px 0 22px; color:var(--gold);
  }
  .constellation-divider .ln{height:1px; width:56px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .grid-preview{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:28px;}
  .mini{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 4px 10px; border:1px solid var(--line); border-radius:16px;
    background:rgba(255,255,255,0.02);
  }
  .mini .mini-badge{
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .mini svg{width:58px; height:58px;}
  .mini span{font-size:10.5px; color:var(--muted); letter-spacing:.02em;}

  button.primary, a.primary{
    appearance:none; border:none; cursor:pointer; width:100%; padding:16px;
    border-radius:999px; font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700; font-size:15px; letter-spacing:.05em; color:#241a22;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    box-shadow:0 12px 24px -10px rgba(217,162,160,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.primary:hover, a.primary:hover{transform:translateY(-2px); box-shadow:0 16px 28px -10px rgba(217,162,160,0.7);}
  button.primary:active{transform:translateY(0);}
  button.primary:focus-visible, a.primary:focus-visible, button.opt:focus-visible, button.ghost:focus-visible{
    outline:2px solid var(--gold-soft); outline-offset:3px;
  }
  .fine{margin-top:14px; text-align:center; font-size:11px; color:var(--muted); opacity:.8;}

  .progress{display:flex; justify-content:center; gap:8px; margin-bottom:22px;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(217,162,160,0.25); transition:background .3s ease, transform .3s ease;}
  .dot.done{background:var(--gold); transform:scale(1.15);}
  .dot.active{background:var(--gold-soft); box-shadow:0 0 0 4px rgba(217,162,160,0.15);}

  .q-index{text-align:center; font-size:11.5px; letter-spacing:.28em; color:var(--gold); text-transform:uppercase; margin-bottom:10px;}
  .q-text{
    font-family:'Shippori Mincho', serif; font-size:20px; line-height:1.7;
    text-align:center; margin-bottom:24px; min-height:80px;
    display:flex; align-items:center; justify-content:center;
  }
  .options{display:flex; flex-direction:column; gap:10px;}
  button.opt{
    appearance:none; cursor:pointer; text-align:left;
    border:1px solid var(--line); background:rgba(255,255,255,0.02); color:var(--cream);
    border-radius:14px; padding:14px 16px; font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13.5px; line-height:1.6;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  button.opt:hover{background:rgba(217,162,160,0.08); border-color:var(--gold); transform:translateX(2px);}

  .back-link{margin-top:18px; text-align:center;}
  button.ghost{
    appearance:none; border:none; background:none; cursor:pointer;
    color:var(--muted); font-size:12px; letter-spacing:.05em;
    text-decoration:underline; text-underline-offset:3px;
  }
  button.ghost:hover{color:var(--gold-soft);}

  .result-badge{
    width:172px; height:172px; margin:4px auto 18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .result-badge::before{content:''; position:absolute; inset:-10px; border-radius:50%; border:1px solid var(--line);}
  .result-badge svg{width:150px; height:150px;}
  .result-label{text-align:center; font-size:11.5px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
  h2.result-name{font-family:'Shippori Mincho', serif; font-weight:800; font-size:28px; text-align:center; margin-bottom:6px;}
  .result-catch{text-align:center; font-size:13.5px; color:var(--gold-soft); margin:0 auto 18px; max-width:320px; line-height:1.8; word-break:keep-all; overflow-wrap:break-word;}
  .result-desc{font-size:14px; line-height:2; color:var(--cream); text-align:center; margin:0 auto 14px; max-width:340px; word-break:keep-all; overflow-wrap:break-word;}
  .result-affirm{font-size:12.5px; color:var(--gold-soft); text-align:center; margin:0 auto 22px; max-width:320px; font-style:normal; letter-spacing:.02em; word-break:keep-all; overflow-wrap:break-word;}
  .keywords{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:26px;}
  .kw{font-size:11.5px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); color:var(--muted);}
  .result-actions{display:flex; flex-direction:column; gap:10px;}
  .copy-msg{text-align:center; font-size:11.5px; color:var(--gold-soft); height:16px; margin-top:6px;}

  footer.credit{text-align:center; margin-top:18px; font-size:10.5px; color:var(--muted); opacity:.6;}
  footer.credit a{color:inherit;}

  /* ---- おすすめ（アフィリエイト） ---- */
  .recs{margin:4px 0 24px; padding-top:20px; border-top:1px solid var(--line);}
  .recs-head{text-align:center; font-size:11.5px; letter-spacing:.24em; color:var(--gold); margin-bottom:6px;}
  .recs-lede{text-align:center; font-size:12.5px; line-height:1.8; color:var(--muted); margin:0 auto 14px; max-width:320px; word-break:keep-all; overflow-wrap:break-word;}
  .rec{
    display:block; text-decoration:none; color:var(--cream);
    border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px;
    background:rgba(255,255,255,0.03);
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .rec:hover{background:rgba(217,162,160,0.08); border-color:var(--gold); transform:translateY(-1px);}
  .rec:focus-visible{outline:2px solid var(--gold-soft); outline-offset:3px;}
  .rec-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .rec-pr{font-size:9.5px; letter-spacing:.08em; padding:2px 6px; border-radius:4px; border:1px solid var(--muted); color:var(--muted);}
  .rec-title{font-weight:700; font-size:14px;}
  .rec-text{font-size:12.5px; line-height:1.7; color:var(--muted);}
  .rec-cta{display:block; margin-top:8px; font-size:12px; color:var(--gold-soft);}
  .recs-note{text-align:center; font-size:10.5px; color:var(--muted); opacity:.75; line-height:1.7;}
</style>
</head>

function renderRecs(key){

  return `
    <div class="recs">
      <div class="recs-head">FOR YOU</div>
      <p class="recs-lede">${RECS_LEDE[key]||''}</p>
      ${items.map(o=>`

}

/* ---------------- state ---------------- */
let step = -1;
let scores = {cat:0, dog:0, swan:0, fox:0, rabbit:0, owl:0};
let resultKey = null;
const card = document.getElementById('card');

function shuffledOpts(opts){ return [...opts].sort(()=>Math.random()-0.5); }
let renderedOpts = [];

function renderStart(){
  card.innerHTML = `
    <div class="eyebrow">6 Love Types / 7 Questions</div>
    <h1 class="title">あなたの<em>恋愛動物タイプ</em>診断</h1>
    <div class="pain-lines">
      <p>「好きなのに、素直になれない」</p>
      <p>「気づけば、いつも同じ恋の終わり方」</p>
    </div>
    <p class="lede">それは欠点じゃない。<br>あなたの"愛し方のクセ"かもしれません。<br>7つの質問に直感で答えるだけで、恋でつまずくポイントと、心から安心できる愛され方が見えてきます。</p>
    <div class="constellation-divider"><span class="ln"></span>♡<span class="ln"></span></div>
    <div class="grid-preview">
      ${Object.keys(ANIMALS).map(k=>`
        <div class="mini">
          <div class="mini-badge" style="background:radial-gradient(circle, ${ANIMALS[k].color}33, transparent 70%)">
            ${ICONS[k]}
          </div>
          <span>${ANIMALS[k].name}</span>
        </div>
      `).join('')}
    </div>
    <button class="primary" id="startBtn">診断をはじめる</button>
    <p class="fine">全7問・所要時間 約1分</p>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{
    step = 0;
    scores = {cat:0, dog:0, swan:0, fox:0, rabbit:0, owl:0};
    renderQuestion();
  });
}

function renderQuestion(){
  const q = QUESTIONS[step];
  renderedOpts = shuffledOpts(q.opts);

  const dots = QUESTIONS.map((_,i)=>{
    let cls = 'dot';
    if(i < step) cls += ' done';
    else if(i === step) cls += ' active';
    return `<span class="${cls}"></span>`;
  }).join('');

  card.innerHTML = `
    <div class="progress">${dots}</div>
    <div class="q-index">Question ${step+1} / ${QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${renderedOpts.map(o=>`<button class="opt" data-a="${o.a}">${o.t}</button>`).join('')}
    </div>
    ${step>0 ? '<div class="back-link"><button class="ghost" id="backBtn">ひとつ前の質問に戻る</button></div>' : ''}
  `;

  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = btn.getAttribute('data-a');
      scores[a] += 1;
      step += 1;
      if(step >= QUESTIONS.length){
        computeResult();
        renderResult();
      } else {
        renderQuestion();
      }
    });
  });

  const back = document.getElementById('backBtn');
  if(back){ back.addEventListener('click', ()=>{ step -= 1; renderQuestion(); }); }
}

function computeResult(){
  let best = null, bestScore = -1;
  Object.keys(scores).forEach(k=>{
    if(scores[k] > bestScore){ bestScore = scores[k]; best = k; }
  });
  resultKey = best;
}

const SITE_URL = "https://chi330-lab.github.io/love-animal-shindan/";

function shareText(){
  const a = ANIMALS[resultKey];
  return `【恋愛動物タイプ診断】\n私は「${a.name}」タイプでした🐾\n${a.catch}\n\nあなたの恋愛動物は？`;
}

function renderResult(){
  const a = ANIMALS[resultKey];
  card.innerHTML = `
    <div class="result-badge" style="background:radial-gradient(circle, ${a.color}3d, transparent 70%); box-shadow:0 0 44px -8px ${a.color}70;">
      ${ICONS[resultKey]}
    </div>
    <div class="result-label">Your Love Type</div>
    <h2 class="result-name">${a.name}</h2>
    <div class="result-catch">${a.catch}</div>
    <div class="result-desc">${a.desc}</div>
    <div class="result-affirm">知れば、もう自分を責めなくていい。それが、心地よい恋への第一歩になる。</div>
    <div class="keywords">
      ${a.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}
    </div>
    ${renderRecs(resultKey)}
    <div class="result-actions">
      <a class="primary" id="xShareBtn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SITE_URL)}" target="_blank" rel="noopener" style="display:block; text-align:center; text-decoration:none;">X でシェアする</a>
      <button class="primary" id="copyBtn" style="background:linear-gradient(135deg, ${a.color}, var(--gold));">シェア用テキストをコピー</button>
      <button class="ghost" id="retryBtn" style="margin-top:2px;">もう一度診断する</button>
    </div>
    <div class="copy-msg" id="copyMsg"></div>
  `;

  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('copyMsg');
    try{
      await navigator.clipboard.writeText(shareText());
      msg.textContent = 'コピーしました。X や Threads に貼り付けてね。';
    }catch(e){
      msg.textContent = 'コピーできませんでした。手動で選択してください。';
    }
  });

  document.getElementById('retryBtn').addEventListener('click', ()=>{ step = -1; renderStart(); });
}

function initStars(){
  const holder = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*4) + 's';
    s.style.opacity = (0.2 + Math.random()*0.6).toFixed(2);
    holder.appendChild(s);
  }
}

initStars();
renderStart();
