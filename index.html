<body>

<div class="stars" id="stars"></div>

<div class="app">
  <div class="card" id="card"></div>
  <footer class="credit">恋愛動物タイプ診断 &mdash; 愛し方を映す六つの獣<br>当サイトはアフィリエイトプログラムによる広告（PR）を掲載しています。<br>アクセス解析のため Google アナリティクス（Cookie）を使用しています。個人を特定する情報は収集していません。</footer>
</div>

<script src="common.js"></script>
<script>
const QUESTIONS = [
  { q:"好きな人ができたとき、あなたは？", opts:[
    {t:"好きなほど、素っ気なくしてしまう", a:"cat"},
    {t:"気持ちをすぐに伝えたくなる", a:"dog"},
    {t:"焦らず、自然な流れに任せる", a:"swan"},
    {t:"本音は隠して、駆け引きを楽しむ", a:"fox"},
    {t:"もっと構ってほしくてそわそわする", a:"rabbit"},
    {t:"本気かどうか、じっくり見極める", a:"owl"}
  ]},
  { q:"連絡がすぐ返ってこないとき、あなたは？", opts:[
    {t:"別に気にしない、自分も自由に過ごす", a:"cat"},
    {t:"既読・未読が気になって仕方ない", a:"dog"},
    {t:"そのうち返ってくるだろうと安心して待てる", a:"swan"},
    {t:"あえてこちらからも返信を遅らせる", a:"fox"},
    {t:"不安になって、何度も確認したくなる", a:"rabbit"},
    {t:"理由を静かに考えて、様子を見る", a:"owl"}
  ]},
  { q:"恋人とは、どれくらいの距離感がいい？", opts:[
    {t:"べったりより、それぞれの時間が欲しい", a:"cat"},
    {t:"できるだけ、一緒にいたい", a:"dog"},
    {t:"近すぎず遠すぎない、ちょうどいい距離", a:"swan"},
    {t:"近づかせすぎず、少し引かせておきたい", a:"fox"},
    {t:"常につながっている安心感が欲しい", a:"rabbit"},
    {t:"信頼できるまでは、少し距離を保ちたい", a:"owl"}
  ]},
  { q:"恋人と喧嘩をしたときの反応は？", opts:[
    {t:"一人になって、頭を冷やしたい", a:"cat"},
    {t:"早く仲直りしたくて、自分から歩み寄る", a:"dog"},
    {t:"感情的にならず、冷静に話し合いたい", a:"swan"},
    {t:"あえて引いて、相手の出方を見る", a:"fox"},
    {t:"嫌われたかもと、不安でいっぱいになる", a:"rabbit"},
    {t:"本音を言わず、心の中で処理する", a:"owl"}
  ]},
  { q:"理想のデートは？", opts:[
    {t:"気ままに、その場のノリで決める", a:"cat"},
    {t:"相手が喜ぶことを、一生懸命考える", a:"dog"},
    {t:"特別じゃなくても、一緒にいるだけでいい", a:"swan"},
    {t:"駆け引きも楽しめる、少し刺激的な時間", a:"fox"},
    {t:"二人の世界にどっぷり浸れる時間", a:"rabbit"},
    {t:"静かな場所で、じっくり語り合う時間", a:"owl"}
  ]},
  { q:"好きな人に、一番求めるものは？", opts:[
    {t:"自由を尊重してくれること", a:"cat"},
    {t:"まっすぐな愛情表現", a:"dog"},
    {t:"一緒にいて、安心できること", a:"swan"},
    {t:"刺激と、追いかけたくなる魅力", a:"fox"},
    {t:"絶対に離れないという安心感", a:"rabbit"},
    {t:"深く自分を理解しようとしてくれること", a:"owl"}
  ]},
  { q:"恋愛における、あなたの本音に近いのは？", opts:[
    {t:"追われると冷める、追うと燃える", a:"cat"},
    {t:"好きになったら、とことん一途", a:"dog"},
    {t:"愛は、静かに深く育てるもの", a:"swan"},
    {t:"恋は駆け引き、主導権を握りたい", a:"fox"},
    {t:"愛されている実感が、何より大事", a:"rabbit"},
    {t:"心を開くまでは慎重、開いたら一途", a:"owl"}
  ]}
];

/* ---------------- state ---------------- */
let step = -1;
let scores = {cat:0, dog:0, swan:0, fox:0, rabbit:0, owl:0};
let resultKey = null;
const card = document.getElementById('card');

function shuffledOpts(opts){ return [...opts].sort(()=>Math.random()-0.5); }
let renderedOpts = [];

function renderStart(){
  card.innerHTML = `
    <div class="eyebrow">6 Love Types / 7 Questions</div>
    <h1 class="title">あなたの<em>恋愛動物タイプ</em>診断</h1>
    <div class="pain-lines">
      <p>「好きなのに、素直になれない」</p>
      <p>「気づけば、いつも同じ恋の終わり方」</p>
    </div>
    <p class="lede">それは欠点じゃない。<br>あなたの"愛し方のクセ"かもしれません。<br>7つの質問に直感で答えるだけで、恋でつまずくポイントと、心から安心できる愛され方が見えてきます。</p>
    <div class="constellation-divider"><span class="ln"></span>♡<span class="ln"></span></div>
    <div class="grid-preview">
      ${Object.keys(ANIMALS).map(k=>`
        <div class="mini">
          <div class="mini-badge" style="background:radial-gradient(circle, ${ANIMALS[k].color}33, transparent 70%)">
            ${ICONS[k]}
          </div>
          <span>${ANIMALS[k].name}</span>
        </div>
      `).join('')}
    </div>
    <button class="primary" id="startBtn">診断をはじめる</button>
    <p class="fine">全7問・所要時間 約1分</p>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{
    step = 0;
    scores = {cat:0, dog:0, swan:0, fox:0, rabbit:0, owl:0};
    track('quiz_start');
    renderQuestion();
  });
}

function renderQuestion(){
  const q = QUESTIONS[step];
  renderedOpts = shuffledOpts(q.opts);

  const dots = QUESTIONS.map((_,i)=>{
    let cls = 'dot';
    if(i < step) cls += ' done';
    else if(i === step) cls += ' active';
    return `<span class="${cls}"></span>`;
  }).join('');

  card.innerHTML = `
    <div class="progress">${dots}</div>
    <div class="q-index">Question ${step+1} / ${QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${renderedOpts.map(o=>`<button class="opt" data-a="${o.a}">${o.t}</button>`).join('')}
    </div>
    ${step>0 ? '<div class="back-link"><button class="ghost" id="backBtn">ひとつ前の質問に戻る</button></div>' : ''}
  `;

  card.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = btn.getAttribute('data-a');
      scores[a] += 1;
      step += 1;
      if(step >= QUESTIONS.length){
        computeResult();
        track('quiz_complete', {love_type: resultKey});
        renderResult();
      } else {
        renderQuestion();
      }
    });
  });

  const back = document.getElementById('backBtn');
  if(back){ back.addEventListener('click', ()=>{ step -= 1; renderQuestion(); }); }
}

function computeResult(){
  let best = null, bestScore = -1;
  Object.keys(scores).forEach(k=>{
    if(scores[k] > bestScore){ bestScore = scores[k]; best = k; }
  });
  resultKey = best;
}

const SITE_URL = "https://chi330-lab.github.io/love-animal-shindan/";

function shareText(){
  const a = ANIMALS[resultKey];
  return `【恋愛動物タイプ診断】\n私は「${a.name}」タイプでした🐾\n${a.catch}\n\nあなたの恋愛動物は？`;
}

function renderResult(){
  const a = ANIMALS[resultKey];
  card.innerHTML = `
    <div class="result-badge" style="background:radial-gradient(circle, ${a.color}3d, transparent 70%); box-shadow:0 0 44px -8px ${a.color}70;">
      ${ICONS[resultKey]}
    </div>
    <div class="result-label">Your Love Type</div>
    <h2 class="result-name">${a.name}</h2>
    <div class="result-catch">${a.catch}</div>
    <div class="result-desc">${a.desc}</div>
    <div class="result-affirm">知れば、もう自分を責めなくていい。それが、心地よい恋への第一歩になる。</div>
    <div class="keywords">
      ${a.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}
    </div>
    ${renderRecs(resultKey)}
    <div class="result-actions">
      <a class="primary" id="xShareBtn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SITE_URL)}" target="_blank" rel="noopener" style="display:block; text-align:center; text-decoration:none;">X でシェアする</a>
      <a class="primary" id="aishoBtn" href="aisho/?me=${resultKey}" style="display:block; text-align:center; text-decoration:none; background:linear-gradient(135deg, var(--gold-soft), ${a.color});">💞 好きな人との相性を見る</a>
      <button class="primary" id="copyBtn" style="background:linear-gradient(135deg, ${a.color}, var(--gold));">シェア用テキストをコピー</button>
      <button class="ghost" id="retryBtn" style="margin-top:2px;">もう一度診断する</button>
    </div>
    <div class="copy-msg" id="copyMsg"></div>
  `;

  card.querySelectorAll('.rec').forEach(el=>{
    el.addEventListener('click', ()=>track('affiliate_click', {offer: el.getAttribute('data-offer'), love_type: resultKey}));
  });
  document.getElementById('xShareBtn').addEventListener('click', ()=>track('share', {method: 'x', love_type: resultKey}));
  document.getElementById('aishoBtn').addEventListener('click', ()=>track('go_aisho', {love_type: resultKey}));

  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    track('share', {method: 'copy', love_type: resultKey});
    const msg = document.getElementById('copyMsg');
    try{
      await navigator.clipboard.writeText(shareText());
      msg.textContent = 'コピーしました。X や Threads に貼り付けてね。';
    }catch(e){
      msg.textContent = 'コピーできませんでした。手動で選択してください。';
    }
  });

  document.getElementById('retryBtn').addEventListener('click', ()=>{ step = -1; renderStart(); });
}

function initStars(){
  const holder = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*4) + 's';
    s.style.opacity = (0.2 + Math.random()*0.6).toFixed(2);
    holder.appendChild(s);
  }
}

initStars();
renderStart();
</script>
</body>
