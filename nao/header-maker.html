<title>なおの見出し画像メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 左：入力、右：できあがり。スマホでは上下に並ぶ */
:root{
  --bg:#f7f1ea; --panel:#fffaf4; --fg:#3f2a20; --muted:#7b6457; --line:#e6d6c6;
  --accent:#b8583a; --accent-ink:#fffaf4; --field:#ffffff;
  --display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211915; --panel:#2b211c; --fg:#f2e6dc; --muted:#bba597; --line:#4a3a31;
  --accent:#e07f5e; --accent-ink:#241a15; --field:#1c1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211915; --panel:#2b211c; --fg:#f2e6dc; --muted:#bba597; --line:#4a3a31;
  --accent:#e07f5e; --accent-ink:#241a15; --field:#1c1512; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:24px}
header h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,36px);margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.step{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:700}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
input[type=text]:focus-visible,.pick:focus-within,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pick{display:block;border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--fg);font-weight:700}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick small{display:block;font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.out{display:grid;gap:12px;min-width:0}
.out img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0}
.howto b{color:var(--accent)}
.status{font-size:14px;color:var(--muted);margin:0}
</style>

<div class="wrap">
  <header>
    <h1>なおの見出し画像メーカー</h1>
    <p>文字なしの絵を選んで、タイトルを入れるだけ。note の見出し画像（1280×670）ができます。</p>
  </header>

  <div class="grid">
    <form class="form" id="f">
      <div class="step">1. 絵をえらぶ</div>
      <label class="pick" for="img">📷 ここを押して、絵をえらぶ
        <small id="imgname">まだ選んでいません（今は見本の背景です）</small>
        <input type="file" id="img" accept="image/*">
      </label>

      <div class="step">2. 文字を入れる</div>
      <label for="lab">いちばん上の帯
        <input type="text" id="lab" value="結婚30年の妻から"></label>
      <div class="row">
        <label for="t1">大きい文字（1行目）
          <input type="text" id="t1" value="結婚が怖い"></label>
        <label for="t2">大きい文字（2行目）
          <input type="text" id="t2" value="男性へ。"></label>
      </div>
      <label for="s1">小さい文字
        <input type="text" id="s1" value="30年連れ添った妻が話す、結婚して"></label>
      <label for="hl">マーカーを引く文字（茶色）
        <input type="text" id="hl" value="変わること・変わらないこと"></label>
      <label for="nm">名前
        <input type="text" id="nm" value="なお"></label>
    </form>

    <section class="out" aria-label="できあがり">
      <div class="step">3. できあがり</div>
      <img id="result" alt="できあがった見出し画像">
      <p class="howto"><b>保存のしかた：</b>スマホは画像を<b>長押し</b>→「写真に保存」。パソコンは画像を<b>右クリック</b>→「名前を付けて画像を保存」。</p>
      <p class="status" id="status">文字を変えると、すぐに画像も変わります。</p>
    </section>
  </div>
</div>

<script>
const W=1280,H=670;
const cv=document.createElement('canvas');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
let photo=null;
const $=id=>document.getElementById(id);
const F=(w,s)=>`${w} ${s}px "Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif`;

function sample(){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#f8e6cf');g.addColorStop(1,'#efb98f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(photo){
    const s=Math.max(W/photo.width,H/photo.height),w=photo.width*s,h=photo.height*s;
    ctx.drawImage(photo,(W-w)/2,(H-h)/2,w,h);
  } else sample();
  const v={lab:$('lab').value,t1:$('t1').value,t2:$('t2').value,s1:$('s1').value,hl:$('hl').value,nm:$('nm').value};
  // card width follows the longest line
  let big=100,sub=32,hls=44;
  ctx.font=F(900,big);let bw=Math.max(ctx.measureText(v.t1).width,ctx.measureText(v.t2).width);
  if(bw>640){big=Math.floor(big*640/bw);ctx.font=F(900,big);bw=Math.max(ctx.measureText(v.t1).width,ctx.measureText(v.t2).width)}
  ctx.font=F(700,sub);let sw=ctx.measureText(v.s1).width;
  if(sw>640){sub=Math.floor(sub*640/sw);ctx.font=F(700,sub);sw=ctx.measureText(v.s1).width}
  ctx.font=F(900,hls);let hw=ctx.measureText(v.hl).width;
  if(hw>640){hls=Math.floor(hls*640/hw);ctx.font=F(900,hls);hw=ctx.measureText(v.hl).width}
  const cardW=Math.min(740,Math.max(560,Math.max(bw,sw,hw)+84));
  const cx=36,cy=40,ch=590,x=cx+40;
  ctx.save();ctx.shadowColor='rgba(150,80,40,.30)';ctx.shadowBlur=28;ctx.shadowOffsetX=6;ctx.shadowOffsetY=10;
  rr(cx,cy,cardW,ch,28);ctx.fillStyle='rgba(255,251,244,.92)';ctx.fill();ctx.restore();
  ctx.textBaseline='top';
  if(v.lab){ctx.font=F(700,32);const lw=ctx.measureText(v.lab).width;
    rr(x,78,lw+44,56,28);ctx.fillStyle='#c45834';ctx.fill();ctx.fillStyle='#fffcf7';ctx.fillText(v.lab,x+22,88)}
  ctx.fillStyle='#4e2e1e';ctx.font=F(900,big);
  ctx.fillText(v.t1,x,158);ctx.fillText(v.t2,x,158+big*1.18);
  const sy=158+big*2.36+14;
  ctx.font=F(700,sub);ctx.fillText(v.s1,x,sy);
  const hy=sy+sub+22;
  if(v.hl){ctx.fillStyle='#f8c8a0';ctx.fillRect(x-4,hy+hls*0.62,hw+8,hls*0.5);
    ctx.fillStyle='#c45834';ctx.font=F(900,hls);ctx.fillText(v.hl,x,hy)}
  ctx.fillStyle='#82604b';ctx.font=F(600,28);ctx.fillText(v.nm,x,cy+ch-62);
  $('result').src=cv.toDataURL('image/jpeg',0.92);
}

$('img').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{photo=im;$('imgname').textContent=file.name;draw()};
  im.onerror=()=>{$('status').textContent='この画像は読みこめませんでした。JPG か PNG の画像を選んでください。'};
  im.src=url;
});
$('f').addEventListener('input',draw);
$('f').addEventListener('submit',e=>e.preventDefault());
Promise.all([900,700,600].map(w=>document.fonts.load(F(w,40),'結婚の妻あ'))).catch(()=>{}).finally(draw);
draw();
</script>
