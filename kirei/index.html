const card = document.getElementById('card');
let step = -1, scores = {}, resultKey = null;

function renderStart(){
  card.innerHTML = `
    <div class="eyebrow">6 Types / 7 Questions</div>
    <h1 class="title">50代からの<br><em>なりたいキレイ</em>診断</h1>
    <p class="lede">憧れの暮らしと、今の毎日。<br>ちょっと遠いと感じても大丈夫。<br>7つの質問で、<strong>あなたが本当になりたいキレイ</strong>と、<br>今日からできる小さな一歩がわかります。</p>

    <p class="fine">全7問・所要時間 約1分</p>
  `;

    step = 0; scores = Object.fromEntries(TYPE_ORDER.map(k=>[k,0]));
    track('kirei_start');
    renderQuestion();
  });
}

function renderQuestion(){
  const q = QUESTIONS[step];
  const opts = [...q.opts].sort(()=>Math.random()-0.5);
  card.innerHTML = `
    <div class="progress">${QUESTIONS.map((_,i)=>`<span class="dot ${i<step?'done':i===step?'active':''}"></span>`).join('')}</div>

    <div class="q-text">${q.q}</div>
    <div class="options">${opts.map(o=>`<button class="opt" data-a="${o.a}">${o.t}</button>`).join('')}</div>
    ${step>0 ? '<div class="back-link"><button class="ghost" id="backBtn">ひとつ前の質問に戻る</button></div>' : ''}
  `;
  card.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click', ()=>{
    scores[btn.getAttribute('data-a')] += 1;
    step += 1;
    if(step >= QUESTIONS.length){
      resultKey = TYPE_ORDER.reduce((best,k)=>scores[k] > scores[best] ? k : best, TYPE_ORDER[0]);
      track('kirei_complete', {kirei_type: resultKey});
      renderResult();
      window.scrollTo(0, 0);
    } else {
      renderQuestion();
    }
  }));
  const back = document.getElementById('backBtn');
  if(back) back.addEventListener('click', ()=>{ step -= 1; renderQuestion(); });
}

function shareText(){
  const t = TYPES[resultKey];
  return `【50代からの なりたいキレイ診断】\n私は「${t.name}」タイプでした${t.mark}\n${t.catch}\n\nあなたのなりたいキレイは？`;
}

function renderItems(key){
  const items = (PRODUCTS[key]||[]).filter(p=>p.url);
  if(!items.length) return '';
  return `
    <div class="box">
      <h3>理想に近づくアイテム</h3>
      <p class="items-lede">毎日のなかで、少しだけ気分が上がるものを。</p>
      ${items.map(p=>`
        <a class="item" href="${p.url}" target="_blank" rel="sponsored noopener">
          <div class="item-top"><span class="pr">PR</span><span class="item-title">${p.title}</span></div>
          ${p.text ? `<div class="item-text">${p.text}</div>` : ''}
          <span class="item-cta">楽天で見てみる &rarr;</span>
        </a>`).join('')}
      <p class="note">※ 上記は広告（アフィリエイトリンク）です。<br>リンク先で購入されると当サイトに報酬が支払われる場合があります。</p>
    </div>
  `;
}

function renderResult(){
  const t = TYPES[resultKey];
  card.innerHTML = `
    <div class="r-mark" style="background:radial-gradient(circle, ${t.color}, transparent 72%);">${t.mark}</div>
    <div class="r-label">YOUR IDEAL BEAUTY</div>
    <h2 class="r-name">${t.name}タイプ</h2>
    <div class="r-catch">${t.catch}</div>
    <div class="r-desc">${t.desc}</div>
    <div class="box">
      <h3>今日からできる、小さな一歩</h3>
      <ol class="steps">${t.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>
    ${renderItems(resultKey)}
    <div class="actions">
      <a class="share" id="xShareBtn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SITE_URL)}" target="_blank" rel="noopener">X でシェアする</a>
      <button class="ghost" id="retryBtn">もう一度診断する</button>
    </div>
  `;
  card.querySelectorAll('a.item').forEach(el=>el.addEventListener('click', ()=>track('affiliate_click', {offer:'rakuten', kirei_type: resultKey, page:'kirei'})));
  document.getElementById('xShareBtn').addEventListener('click', ()=>track('share', {method:'x', kirei_type: resultKey, page:'kirei'}));
  document.getElementById('retryBtn').addEventListener('click', ()=>{ step = -1; renderStart(); window.scrollTo(0, 0); });
}

renderStart();
</script>
</body>
</html>
